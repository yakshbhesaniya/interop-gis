<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Web Client</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.1.0/ol.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light text-dark">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="bi bi-globe-americas fs-4"></i> GIS Web Client
            </a>
        </div>
    </nav>

    <div class="container-fluid py-3 main-container">
        <div class="row h-100 g-3">
            <!-- Left Panel: Controls -->
            <div class="col-md-4 col-lg-3 h-100 d-flex flex-column">
                <div class="card shadow border-0 h-100 flex-grow-1 rounded-4">
                    <div class="card-header bg-white border-bottom-0 pb-0 pt-3 rounded-top-4">
                        <!-- Tabs -->
                        <ul class="nav nav-tabs nav-fill" id="serviceTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold" id="wms-tab" data-bs-toggle="tab"
                                    data-bs-target="#wms-panel" type="button" role="tab">WMS</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold text-muted" id="wfs-tab" data-bs-toggle="tab"
                                    data-bs-target="#wfs-panel" type="button" role="tab">WFS</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold text-muted" id="layers-tab" data-bs-toggle="tab"
                                    data-bs-target="#layers-panel" type="button" role="tab">
                                    <i class="bi bi-layers"></i> Layers
                                </button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body overflow-auto tab-content bg-white pb-4 rounded-bottom-4">
                        <!-- WMS Panel -->
                        <div class="tab-pane fade show active" id="wms-panel" role="tabpanel">

                            <!-- URL Input -->
                            <div class="mb-4 mt-2">
                                <label for="serverUrl"
                                    class="form-label fw-bold text-secondary small text-uppercase">WMS Server
                                    URL</label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <input type="url" class="form-control fs-6" id="serverUrl"
                                        placeholder="http://localhost:8080/geoserver/wms">
                                    <button class="btn btn-primary fw-bold px-4" id="btnOk" type="button">OK</button>
                                </div>
                                <div id="loadingIndicator" class="form-text text-primary d-none mt-2 fw-semibold">
                                    <span class="spinner-border spinner-border-sm me-1" role="status"
                                        aria-hidden="true"></span> Fetching capabilities...
                                </div>
                            </div>

                            <hr class="text-muted opacity-25">

                            <!-- Layers Dropdown -->
                            <div class="mb-3">
                                <label for="layerSelect"
                                    class="form-label fw-bold text-secondary small text-uppercase">Layers</label>
                                <select class="form-select form-select-lg fs-6 shadow-sm" id="layerSelect" disabled>
                                    <option value="" selected>Waiting for connection...</option>
                                </select>
                            </div>

                            <!-- Format & SRS Dropdown -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="formatSelect"
                                        class="form-label fw-bold text-secondary small text-uppercase">Format</label>
                                    <select class="form-select shadow-sm" id="formatSelect">
                                        <option value="image/png" selected>image/png</option>
                                        <option value="image/jpeg">image/jpeg</option>
                                        <option value="image/gif">image/gif</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="srsSelect"
                                        class="form-label fw-bold text-secondary small text-uppercase">SRS</label>
                                    <select class="form-select shadow-sm" id="srsSelect">
                                        <option value="EPSG:3857" selected>EPSG:3857</option>
                                        <option value="EPSG:4326">EPSG:4326</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Bounding Box -->
                            <div class="mb-3 p-3 bg-light rounded-3 border">
                                <label
                                    class="form-label fw-bold text-secondary small text-uppercase mb-3 d-block text-center border-bottom pb-2">Bounding
                                    Coordinates</label>
                                <div class="row g-2 align-items-center">
                                    <div class="col-12 text-center">
                                        <input type="number" step="any"
                                            class="form-control form-control-sm mx-auto text-center" id="bboxTop"
                                            placeholder="Top / North" style="max-width: 140px;">
                                    </div>
                                    <div class="col-6 text-end">
                                        <input type="number" step="any"
                                            class="form-control form-control-sm ms-auto text-center" id="bboxLeft"
                                            placeholder="Left / West" style="max-width: 140px;">
                                    </div>
                                    <div class="col-6 text-start">
                                        <input type="number" step="any" class="form-control form-control-sm text-center"
                                            id="bboxRight" placeholder="Right / East" style="max-width: 140px;">
                                    </div>
                                    <div class="col-12 text-center">
                                        <input type="number" step="any"
                                            class="form-control form-control-sm mx-auto text-center" id="bboxBottom"
                                            placeholder="Bottom / South" style="max-width: 140px;">
                                    </div>
                                </div>
                            </div>

                            <div class="row g-2 mb-4">
                                <!-- Feature Info -->
                                <div class="col-12">
                                    <label class="form-label fw-bold text-secondary small text-uppercase">Feature
                                        Info</label>
                                    <div class="input-group input-group-sm">
                                        <input type="number" class="form-control text-center bg-light" id="infoX"
                                            placeholder="X px" readonly>
                                        <span
                                            class="input-group-text p-0 px-1 border-0 bg-transparent text-muted">,</span>
                                        <input type="number" class="form-control text-center bg-light" id="infoY"
                                            placeholder="Y px" readonly>
                                    </div>
                                </div>
                            </div>

                            <!-- RUN Button -->
                            <div class="d-grid mt-4">
                                <button class="btn btn-success btn-lg fw-bold shadow position-relative overflow-hidden"
                                    id="btnRun" disabled>
                                    <i class="bi bi-play-fill me-1 fs-5 align-middle"></i> RUN REQUEST
                                </button>
                            </div>
                        </div>

                        <!-- WFS Panel -->
                        <div class="tab-pane fade" id="wfs-panel" role="tabpanel">

                            <!-- URL Input -->
                            <div class="mb-4 mt-2">
                                <label for="wfsServerUrl"
                                    class="form-label fw-bold text-secondary small text-uppercase">WFS Server
                                    URL</label>
                                <div class="input-group input-group-lg shadow-sm">
                                    <input type="url" class="form-control fs-6" id="wfsServerUrl"
                                        placeholder="http://localhost:8080/geoserver/wfs">
                                    <button class="btn btn-primary fw-bold px-4" id="wfsBtnOk" type="button">OK</button>
                                </div>
                                <div id="wfsLoadingIndicator" class="form-text text-primary d-none mt-2 fw-semibold">
                                    <span class="spinner-border spinner-border-sm me-1" role="status"
                                        aria-hidden="true"></span> Fetching capabilities...
                                </div>
                            </div>

                            <hr class="text-muted opacity-25">

                            <!-- Layers Dropdown -->
                            <div class="mb-3">
                                <label for="wfsLayerSelect"
                                    class="form-label fw-bold text-secondary small text-uppercase">Feature Types
                                    (Layers)</label>
                                <select class="form-select form-select-lg fs-6 shadow-sm" id="wfsLayerSelect" disabled>
                                    <option value="" selected>Waiting for connection...</option>
                                </select>
                            </div>

                            <!-- Format & SRS Dropdown -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="wfsFormatSelect"
                                        class="form-label fw-bold text-secondary small text-uppercase">Format</label>
                                    <select class="form-select shadow-sm" id="wfsFormatSelect">
                                        <option value="application/json" selected>GeoJSON</option>
                                        <option value="text/xml; subtype=gml/3.1.1">GML 3.1.1</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="wfsSrsSelect"
                                        class="form-label fw-bold text-secondary small text-uppercase">SRS</label>
                                    <select class="form-select shadow-sm" id="wfsSrsSelect">
                                        <option value="EPSG:3857" selected>EPSG:3857</option>
                                        <option value="EPSG:4326">EPSG:4326</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Bounding Box -->
                            <div class="mb-3 p-3 bg-light rounded-3 border">
                                <label
                                    class="form-label fw-bold text-secondary small text-uppercase mb-3 d-block text-center border-bottom pb-2">Bounding
                                    Coordinates</label>
                                <div class="row g-2 align-items-center">
                                    <div class="col-12 text-center">
                                        <input type="number" step="any"
                                            class="form-control form-control-sm mx-auto text-center" id="wfsBboxTop"
                                            placeholder="Top / North" style="max-width: 140px;">
                                    </div>
                                    <div class="col-6 text-end">
                                        <input type="number" step="any"
                                            class="form-control form-control-sm ms-auto text-center" id="wfsBboxLeft"
                                            placeholder="Left / West" style="max-width: 140px;">
                                    </div>
                                    <div class="col-6 text-start">
                                        <input type="number" step="any" class="form-control form-control-sm text-center"
                                            id="wfsBboxRight" placeholder="Right / East" style="max-width: 140px;">
                                    </div>
                                    <div class="col-12 text-center">
                                        <input type="number" step="any"
                                            class="form-control form-control-sm mx-auto text-center" id="wfsBboxBottom"
                                            placeholder="Bottom / South" style="max-width: 140px;">
                                    </div>
                                </div>
                            </div>



                            <!-- RUN Button -->
                            <div class="d-grid mt-4">
                                <button class="btn btn-success btn-lg fw-bold shadow position-relative overflow-hidden"
                                    id="wfsBtnRun" disabled>
                                    <i class="bi bi-play-fill me-1 fs-5 align-middle"></i> RUN WFS REQUEST
                                </button>
                            </div>
                        </div>

                        <!-- Layers Panel -->
                        <div class="tab-pane fade" id="layers-panel" role="tabpanel">
                            <div class="p-3">
                                <h6 class="fw-bold text-secondary text-uppercase mb-3">Active Layers</h6>
                                <ul class="list-group shadow-sm" id="layerList">
                                    <li class="list-group-item text-muted text-center py-4" id="noLayersMsg">
                                        No layers added yet.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Map & XML -->
            <div class="col-md-8 col-lg-9 h-100 d-flex flex-column gap-3">

                <!-- Map View -->
                <div class="card shadow border-0 flex-grow-1 map-container-card rounded-4">
                    <div
                        class="card-header bg-white d-flex justify-content-between align-items-center rounded-top-4 py-3">
                        <span class="fw-bold text-dark text-uppercase d-flex align-items-center gap-2"
                            style="letter-spacing: 0.5px;">
                            <i class="bi bi-map-fill text-primary"></i> Map View
                        </span>
                        <span id="mapCoords"
                            class="badge bg-light text-secondary border font-monospace border-light py-2 px-3 shadow-sm">Lon:
                            0.00, Lat: 0.00</span>
                    </div>
                    <div class="card-body p-0 position-relative bg-light rounded-bottom-4 overflow-hidden">
                        <div id="map" class="w-100 h-100"></div>
                        <div id="mapOverlay"
                            class="position-absolute top-50 start-50 translate-middle text-center p-4 rounded-4 shadow"
                            style="background: rgba(255,255,255,0.9); z-index: 1000; display: none;">
                            <div class="spinner-border text-primary mb-2" role="status"></div>
                            <div class="fw-bold text-secondary">Loading Map Layer...</div>
                        </div>
                    </div>
                </div>

                <!-- Feature Info Response Panel -->
                <div class="card shadow border-0 xml-panel-card rounded-4">
                    <div
                        class="card-header bg-white d-flex justify-content-between align-items-center rounded-top-4 py-2">
                        <span class="fw-bold text-dark text-uppercase d-flex align-items-center gap-2"
                            style="letter-spacing: 0.5px;">
                            <i class="bi bi-info-square text-success"></i> Map Details & Logs
                        </span>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary fw-semibold rounded-pill px-3"
                                id="btnToggleLog">
                                <i class="bi bi-terminal me-1"></i> Logs
                            </button>
                            <button class="btn btn-sm btn-outline-danger fw-semibold rounded-pill px-3"
                                id="btnClearXml">
                                <i class="bi bi-trash3 me-1"></i> Clear
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0 rounded-bottom-4 overflow-hidden position-relative"
                        style="min-height:0; height:100%;">
                        <!-- Attribute Table -->
                        <div id="attributeTableContainer" class="w-100 h-100 bg-white p-3 overflow-auto"
                            style="display: none;">
                            <h6 class="text-muted text-center mt-3">Click on a feature to view attributes...</h6>
                        </div>
                        <!-- Log -->
                        <textarea id="xmlResponseTextarea"
                            class="form-control h-100 border-0 rounded-0 font-monospace text-light p-3" readonly
                            spellcheck="false" placeholder="Awaiting server queries..."></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.1.0/dist/ol.js"></script>
    <script src="static/js/app.js"></script>
</body>

</html>
